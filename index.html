<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#1e3a5f" />
    <title>システム手帳</title>
    <script>
      // 背景色を最初の描画前に反映（ちらつき防止）
      try {
        var _t = localStorage.getItem("sth_v3_theme");
        var _k = { white: 1, cream: 1, sky: 1, mint: 1, pink: 1, lavender: 1 };
        if (_t) {
          document.documentElement.dataset.theme = _t;
          document.documentElement.dataset.kind = _k[_t] ? "light" : "dark";
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css?v=20261105-235522" />
  </head>
  <body>
    <div id="app-shell">
      <header id="app-header">
        <h1>システム手帳</h1>
        <div class="header-btns">
        <button id="btn-theme" class="btn-theme" aria-label="背景色"><span class="theme-ring" aria-hidden="true"></span></button>
        <button id="btn-refresh" class="btn-refresh" aria-label="更新">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M17.65 6.35A7.96 7.96 0 0012 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
          更新
        </button>
        </div>
      </header>
      <nav id="tab-bar">
        <button class="tab-btn" data-tab="daily">デイリー</button>
        <button class="tab-btn" data-tab="task">タスク</button>
        <button class="tab-btn" data-tab="habit">習慣</button>
        <button class="tab-btn" data-tab="meal">食事</button>
        <button class="tab-btn" data-tab="memo">メモ</button>
      </nav>
      <main id="scroll-container">
        <div id="tab-content"></div>
      </main>
    </div>
    <script type="module" src="js/app.js?v=20261105-235522"></script>
  </body>
</html>
